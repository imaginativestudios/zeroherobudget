name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Browsers
        # chromium AND webkit: the config defines four projects, and two of them
        # resolve to webkit (Tablet WebKit -> iPad Mini, Small Mobile WebKit -> Galaxy S III).
        # Installing chromium alone meant those projects could never launch, so
        # half the viewport matrix was silently unexercised -- invisible until
        # the summary gate below was fixed to actually report results.
        run: npx playwright install --with-deps chromium webkit

      - name: Run Playwright tests with coverage
        id: playwright
        run: npx playwright test --reporter=json > test-results.json || true
        env:
          COVERAGE: 'true'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Generate coverage report
        if: always()
        run: |
          if [ -d ".nyc_output" ]; then
            npx nyc report --reporter=json-summary --reporter=text --reporter=lcov
          fi

      - name: Extract coverage summary
        id: coverage
        if: always()
        run: |
          if [ -f "coverage/coverage-summary.json" ]; then
            LINES=$(jq '.total.lines.pct' coverage/coverage-summary.json)
            STATEMENTS=$(jq '.total.statements.pct' coverage/coverage-summary.json)
            FUNCTIONS=$(jq '.total.functions.pct' coverage/coverage-summary.json)
            BRANCHES=$(jq '.total.branches.pct' coverage/coverage-summary.json)
            
            echo "lines=$LINES" >> $GITHUB_OUTPUT
            echo "statements=$STATEMENTS" >> $GITHUB_OUTPUT
            echo "functions=$FUNCTIONS" >> $GITHUB_OUTPUT
            echo "branches=$BRANCHES" >> $GITHUB_OUTPUT
            echo "has_coverage=true" >> $GITHUB_OUTPUT
          else
            echo "has_coverage=false" >> $GITHUB_OUTPUT
            echo "lines=0" >> $GITHUB_OUTPUT
            echo "statements=0" >> $GITHUB_OUTPUT
            echo "functions=0" >> $GITHUB_OUTPUT
            echo "branches=0" >> $GITHUB_OUTPUT
          fi

      - name: Generate test summary
        id: summary
        if: always()
        run: |
          # Counts come from Playwright's own top-level .stats block.
          # The previous path -- .suites[].specs[].tests[] -- matched nothing,
          # because any file using test.describe nests its specs one suite
          # deeper. It silently returned 0 passed / 0 failed for every run,
          # which made the "Fail if tests failed" gate below unreachable and
          # every green check meaningless. .stats is flat and reporter-stable.
          #
          # Fails closed: a missing or unparseable report sets results_ok=false,
          # which the gate treats as failure. Absence of evidence must not read
          # as evidence of success.
          if [ -f test-results.json ] && jq -e '.stats' test-results.json >/dev/null 2>&1; then
            PASSED=$(jq -r '.stats.expected // 0' test-results.json)
            FAILED=$(jq -r '.stats.unexpected // 0' test-results.json)
            SKIPPED=$(jq -r '.stats.skipped // 0' test-results.json)
            FLAKY=$(jq -r '.stats.flaky // 0' test-results.json)
            TOTAL=$((PASSED + FAILED + SKIPPED + FLAKY))

            if [ "$FAILED" -gt 0 ]; then
              STATUS="❌ Failed"
            elif [ "$TOTAL" -eq 0 ]; then
              # A run that executed nothing is not a pass.
              STATUS="⚠️ No tests executed"
            else
              STATUS="✅ Passed"
            fi

            echo "status=$STATUS" >> $GITHUB_OUTPUT
            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
            echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT
            echo "flaky=$FLAKY" >> $GITHUB_OUTPUT
            echo "total=$TOTAL" >> $GITHUB_OUTPUT
            echo "results_ok=true" >> $GITHUB_OUTPUT
          else
            echo "status=⚠️ No results -- test run produced no parseable report" >> $GITHUB_OUTPUT
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "failed=0" >> $GITHUB_OUTPUT
            echo "skipped=0" >> $GITHUB_OUTPUT
            echo "flaky=0" >> $GITHUB_OUTPUT
            echo "total=0" >> $GITHUB_OUTPUT
            echo "results_ok=false" >> $GITHUB_OUTPUT
          fi

      - name: Post PR comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ steps.summary.outputs.status }}';
            const passed = '${{ steps.summary.outputs.passed }}';
            const failed = '${{ steps.summary.outputs.failed }}';
            const skipped = '${{ steps.summary.outputs.skipped }}';
            const total = '${{ steps.summary.outputs.total }}';
            const hasCoverage = '${{ steps.coverage.outputs.has_coverage }}' === 'true';
            const lines = '${{ steps.coverage.outputs.lines }}';
            const statements = '${{ steps.coverage.outputs.statements }}';
            const functions = '${{ steps.coverage.outputs.functions }}';
            const branches = '${{ steps.coverage.outputs.branches }}';
            
            let coverageSection = '';
            if (hasCoverage) {
              const getEmoji = (pct) => {
                const num = parseFloat(pct);
                if (num >= 80) return '🟢';
                if (num >= 50) return '🟡';
                return '🔴';
              };
              
              coverageSection = `
            
            ### 📊 Code Coverage
            
            | Metric | Coverage |
            |--------|----------|
            | ${getEmoji(lines)} Lines | ${lines}% |
            | ${getEmoji(statements)} Statements | ${statements}% |
            | ${getEmoji(functions)} Functions | ${functions}% |
            | ${getEmoji(branches)} Branches | ${branches}% |`;
            }
            
            const body = `## 🎭 Playwright Test Results
            
            | Status | Result |
            |--------|--------|
            | **Overall** | ${status} |
            | ✅ Passed | ${passed} |
            | ❌ Failed | ${failed} |
            | ⏭️ Skipped | ${skipped} |
            | **Total** | ${total} |
            ${coverageSection}
            
            [View full report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(c => c.body.includes('🎭 Playwright Test Results'));
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-regression-diffs
          path: |
            e2e/**/*-snapshots/
            test-results/**/*-diff.png
            test-results/**/*-actual.png
          retention-days: 14
      
      # Fails on three distinct conditions, all of which previously passed:
      #   1. tests failed
      #   2. the report was missing or unparseable (results_ok=false)
      #   3. the run executed zero tests
      # (3) matters because a config or browser-install error can produce a
      # valid, empty report -- which is not a passing build.
      - name: Fail if tests failed or did not run
        if: >-
          steps.summary.outputs.failed != '0' ||
          steps.summary.outputs.results_ok != 'true' ||
          steps.summary.outputs.total == '0'
        run: |
          echo "status:     ${{ steps.summary.outputs.status }}"
          echo "passed:     ${{ steps.summary.outputs.passed }}"
          echo "failed:     ${{ steps.summary.outputs.failed }}"
          echo "skipped:    ${{ steps.summary.outputs.skipped }}"
          echo "flaky:      ${{ steps.summary.outputs.flaky }}"
          echo "total:      ${{ steps.summary.outputs.total }}"
          echo "results_ok: ${{ steps.summary.outputs.results_ok }}"

          # A run that collected nothing reports its reason in the JSON
          # reporter's top-level .errors[], not on stderr -- so without this the
          # failure is silent and undiagnosable from the log alone.
          if [ -f test-results.json ]; then
            echo ""
            echo "--- reporter errors ---"
            jq -r '.errors[]? | .message // .value // tostring' test-results.json 2>/dev/null | head -40 \
              || echo "(none parseable)"
            echo ""
            echo "--- report shape ---"
            jq -r '{suites: (.suites|length), errors: (.errors|length), stats: .stats}' test-results.json 2>/dev/null \
              || echo "(unparseable)"
          else
            echo "test-results.json was never written"
          fi
          exit 1
