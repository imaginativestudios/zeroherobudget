# Generates Playwright visual-regression baselines on Linux and opens a PR.
name: Update Visual Snapshots

# Manual only. Baselines are deliberate artefacts: regenerating them accepts
# whatever the UI currently looks like, so it must never happen automatically
# on push, or a visual regression would silently rewrite its own baseline and
# the entire visual suite would stop detecting anything.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are baselines being regenerated? (recorded in the PR body)'
        required: true
        default: 'Initial baseline generation'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-snapshots:
    timeout-minutes: 45
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # chromium AND webkit: two of the four projects resolve to webkit
      # (Tablet -> iPad Mini, Small Mobile -> Galaxy S III). Installing only
      # chromium would silently produce baselines for half the matrix.
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium webkit

      # --update-snapshots writes missing baselines and overwrites changed ones,
      # then reports success. Only visual-regression.spec.ts uses the screenshot
      # fixture, so scoping to it avoids running ~230 unrelated tests.
      #
      # continue-on-error: unrelated failures in that file must not prevent the
      # baselines it DID produce from being committed. The PR diff is the
      # review gate, not this step's exit code.
      - name: Generate baselines
        continue-on-error: true
        run: npx playwright test e2e/visual-regression.spec.ts --update-snapshots --reporter=line
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Report what was produced
        run: |
          echo "Linux baselines on disk:"
          find e2e -name '*-linux.png' | wc -l
          echo ""
          git status --porcelain -- 'e2e/**/*.png' | head -50

      # A baseline is only worth committing if it shows the page it is named
      # after. When a spec navigates somewhere gated and the app redirects, the
      # screenshot still succeeds -- it just captures the sign-in modal, and
      # --update-snapshots writes that in as the approved appearance of the
      # page. Nothing in Playwright objects, because a modal photographs as
      # well as a dashboard does.
      #
      # The tell is duplication. Two differently-named pages that render
      # byte-identical images are not two pages; they are the same wrong screen
      # captured twice. The first batch of Linux baselines contained 69 such
      # files across four groups -- dashboard, transactions, budget, reports,
      # subscriptions and twelve others were all the same picture of the login
      # modal. It was caught by hand, after the PR had sat for two days.
      #
      # This runs that check automatically and fails the workflow, so a batch
      # like that can never reach a PR again.
      - name: Reject duplicate baselines
        run: |
          # Pages that legitimately render identically. Keep this list short and
          # justify every entry -- each one is a hole in the check.
          #   auth-login / auth-modal: the same sign-in modal, reached by
          #   navigating to /auth and by clicking Sign In on /landing.
          ALLOWED="auth-login auth-modal"

          find e2e -name '*-linux.png' -print0 | xargs -0 md5sum | sort > /tmp/baseline-hashes.txt

          violations=0
          for hash in $(cut -d' ' -f1 /tmp/baseline-hashes.txt | sort | uniq -d); do
            names=$(grep "^$hash " /tmp/baseline-hashes.txt | sed 's|.*/||')

            # Skip the group only if every file in it is on the allowlist.
            unlisted=0
            while IFS= read -r n; do
              [ -z "$n" ] && continue
              ok=0
              for prefix in $ALLOWED; do
                case "$n" in "$prefix"-*) ok=1 ;; esac
              done
              [ "$ok" -eq 0 ] && unlisted=1
            done <<< "$names"

            [ "$unlisted" -eq 0 ] && continue

            violations=$((violations + 1))
            {
              echo "### Identical baselines: \`$hash\`"
              echo ""
              echo "$names" | sed 's/^/- /'
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
            echo "DUPLICATE $hash"
            echo "$names" | sed 's/^/    /'
          done

          total=$(find e2e -name '*-linux.png' | wc -l | tr -d ' ')
          unique=$(cut -d' ' -f1 /tmp/baseline-hashes.txt | sort -u | wc -l | tr -d ' ')

          if [ "$violations" -gt 0 ]; then
            {
              echo "**$violations group(s) of differently-named pages produced byte-identical images.**"
              echo ""
              echo "That means the suite captured the same screen more than once — usually the"
              echo "sign-in modal, after the app redirected a gated route to \`/auth\`. Baselines"
              echo "were NOT committed. Fix the specs so each page renders itself, then re-run."
            } >> "$GITHUB_STEP_SUMMARY"
            echo ""
            echo "FAILED: $violations duplicate group(s). $total files, only $unique unique images."
            exit 1
          fi

          echo "OK: $total baselines, $unique unique images, no unexpected duplicates."
          echo "$total baselines, $unique unique images, no unexpected duplicates." >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and open PR
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ inputs.reason }}
        run: |
          if [ -z "$(git status --porcelain -- 'e2e/**/*.png')" ]; then
            echo "No baseline changes — nothing to open a PR for."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="chore/update-snapshots-${{ github.run_number }}"
          git checkout -b "$BRANCH"
          git add -- 'e2e/**/*.png'
          git commit -m "Update Playwright visual baselines (Linux)

          Generated by the Update Visual Snapshots workflow, run ${{ github.run_number }}.

          Reason given: $REASON"
          git push -u origin "$BRANCH"

          ADDED=$(git diff --diff-filter=A --name-only HEAD~1 -- 'e2e/**/*.png' | wc -l | tr -d ' ')
          CHANGED=$(git diff --diff-filter=M --name-only HEAD~1 -- 'e2e/**/*.png' | wc -l | tr -d ' ')

          gh pr create \
            --base "${{ github.ref_name }}" \
            --head "$BRANCH" \
            --title "Update Playwright visual baselines (Linux)" \
            --body "$(cat <<EOF
          Generated by **Update Visual Snapshots**, run ${{ github.run_number }}.

          **Reason given:** $REASON

          | | |
          |---|---|
          | Baselines added | $ADDED |
          | Baselines changed | **$CHANGED** |

          ## How to review

          **Added** baselines are new coverage — check the images look correct, since whatever is committed becomes the definition of "correct" from now on.

          **Changed** baselines deserve real scrutiny. Each one means the UI moved. Confirm every change is intended before merging; approving an unintended change here is how a visual regression gets permanently baked in and the suite stops catching it.

          Only \`-linux.png\` files are committed. CI runs on Linux, and baselines from macOS or Windows renderers can never match it — those are gitignored.
          EOF
          )"
